<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://*.googleapis.com; object-src 'none'; base-uri 'none'">
  <meta name="theme-color" content="#ffffff">
  <title>Catálogo</title>
  <link rel="icon" href="assets/icon-192.png">
  <style>
    :root { --ink: #14171c; --muted: #6b7280; --line: #e7e9ee; --soft: #f5f6f8; --accent: #0d5bff; --wa: #1fa855; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--soft); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    header { position: sticky; top: 0; z-index: 5; background: rgba(255,255,255,.96); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: calc(12px + env(safe-area-inset-top)) 16px 12px; }
    .head { max-width: 1100px; margin: 0 auto; display: grid; gap: 10px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -.01em; }
    .sub { color: var(--muted); font-size: 13px; }
    .search { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; font-size: 16px; background: #fff; }
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
    .chip { flex: none; height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font: inherit; font-size: 13px; cursor: pointer; }
    .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    main { max-width: 1100px; margin: 0 auto; padding: 16px 12px 90px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
    @media (max-width: 520px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; } }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
    .photo { aspect-ratio: 4 / 3; background: #eef0f4; display: grid; place-items: center; color: #9aa1ad; font-size: 34px; font-weight: 700; }
    .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .info { padding: 10px 12px 12px; display: grid; gap: 6px; flex: 1; }
    .name { font-weight: 700; font-size: 15px; line-height: 1.25; }
    .meta { color: var(--muted); font-size: 12.5px; }
    .price { font-size: 17px; font-weight: 800; }
    .sizes { display: flex; flex-wrap: wrap; gap: 5px; }
    .size { min-width: 38px; height: 34px; border: 1px solid var(--line); border-radius: 9px; background: #fff; font: inherit; font-size: 13px; cursor: pointer; }
    .size.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .ask { margin-top: auto; height: 42px; border: 0; border-radius: 11px; background: var(--wa); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .empty, .state { text-align: center; color: var(--muted); padding: 60px 16px; }
    footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 30px; }
    .float { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 6; height: 52px; padding: 0 20px; border: 0; border-radius: 999px; background: var(--wa); color: #fff; font: inherit; font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.2); cursor: pointer; }
  </style>
</head>
<body>
  <div id="catalog"><div class="state">Cargando catálogo…</div></div>
  <script type="module" src="js/catalog.js?v=0.4.0-murcfgft"></script>
</body>
</html>
